; ============================================================================
; MegaSquirt INI Definition (PLACEHOLDER)
; ============================================================================
; This is a MINIMAL placeholder INI for ZTune development and testing.
; It is NOT the real MS3 INI. Replace this file with the actual
; ms3_3.x.ini from the MegaSquirt firmware before real-world use.
;
; Signature "Megasquirt-Extra 3.1.x" matches typical MS3 firmware.
; ============================================================================

[MegaTune]
    queryCommand = "Q"
    signature    = "Megasquirt-Extra 3.1.x"
    versionInfo  = ""
    iniSpecVersion = "3.64"

[Constants]
    endianness    = big
    nPages        = 1
    pageSize      = 1024

    page = 1

    reqFuel       = bits,    U08,    0,    [0:255], "ms",       0.1, 0.0
    nCylinders    = bits,    U08,    1,    [1:16],  "cyl",      1.0, 0.0

[OutputChannels]
    secl           = scalar, U08,    0,    "sec",      1.0,    0.0
    rpm            = scalar, U16,    2,    "RPM",      1.0,    0.0
    tps            = scalar, U08,    4,    "%",        1.0,    0.0
    coolant        = scalar, U16,    6,    "F",        1.0,    0.0
    map            = scalar, U16,    8,    "kPa",      1.0,    0.0
    batteryVoltage = scalar, U08,   10,    "V",        0.1,    0.0
    afr            = scalar, U16,   12,    "AFR",      0.1,    0.0
    ignitionAdvance= scalar, S16,   14,    "deg",      1.0,    0.0

[TableEditor]
    tableEditor = "VE Table 1", veTable1Tbl, veTable1Map, { rpmBins1, mapBins1 }

[Constants]
    page = 1
    rpmBins1       = array, U08,   20, [8], "RPM",  100.0, 0.0
    mapBins1       = array, U08,   28, [8], "kPa",   1.0, 0.0
    veTable1Tbl    = array, U08,   36, [64], "%",    1.0, 0.0

[GaugeConfigurations]
    gaugeConfig = rpm,        "RPM",        0,  8000, 0,  8000, 0,  8000, 0,  0, 0
    gaugeConfig = tps,        "TPS",        0,   100, 0,   100, 0,   100, 0,  0, 0

[Menu]
    menu = "Tuning"
        subMenu = "VE Table 1", veTable1Tbl
