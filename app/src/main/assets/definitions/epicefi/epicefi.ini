; ============================================================================
; epicEFI INI Definition (PLACEHOLDER)
; ============================================================================
; epicEFI uses a JSON-over-newline protocol, not the MS serial protocol.
; This INI is a minimal placeholder for ZTune development.
; ============================================================================

[MegaTune]
    queryCommand = "Q"
    signature    = "epicEFI 1.0"
    versionInfo  = ""
    iniSpecVersion = "3.64"

[Constants]
    endianness    = little
    nPages        = 1
    pageSize      = 1024

[OutputChannels]
    secl           = scalar, U08,    0,    "sec",      1.0,    0.0
    rpm            = scalar, U16,    2,    "RPM",      1.0,    0.0

[Menu]
    menu = "Tuning"
