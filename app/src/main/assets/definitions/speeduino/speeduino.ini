; ============================================================================
; Speeduino INI Definition (PLACEHOLDER)
; ============================================================================
; This is a MINIMAL placeholder INI for ZTune development and testing.
; It is NOT the real Speeduino INI. Replace this file with the actual
; speeduino.ini from the Speeduino firmware repository before real-world use:
;   https://github.com/speeduino/speeduino/tree/master/reference
;
; Signature "Speeduino 202401" matches the MockEcuTransport default for demo mode.
; ============================================================================

[MegaTune]
    queryCommand = "Q"
    signature    = "Speeduino 202401"
    versionInfo  = ""
    iniSpecVersion = "3.64"

[Constants]
    endianness    = little
    nPages        = 1
    pageSize      = 1024

    page = 1

    ; ---- Scalars (minimal set for testing) ----
    reqFuel       = bits,    U08,    0,    [0:255], "ms",       0.1, 0.0
    nCylinders    = bits,    U08,    1,    [1:16],  "cyl",      1.0, 0.0
    twoStroke     = bits,    U08,    2,    [0:1],   "",         1.0, 0.0

[OutputChannels]
    ; Channel definitions: name = { type, offset, length, scale, translate, units, lo, hi }
    ; Minimal set for dashboard testing.
    secl           = scalar, U08,    0,    "sec",      1.0,    0.0
    rpm            = scalar, U16,    2,    "RPM",      1.0,    0.0
    tps            = scalar, U08,    4,    "%",        1.0,    0.0
    coolant        = scalar, U16,    6,    "C",        1.0,   -40.0
    iat            = scalar, U16,    8,    "C",        1.0,   -40.0
    map            = scalar, U16,   10,    "kPa",      1.0,    0.0
    batteryVoltage = scalar, U08,   12,    "V",        0.1,    0.0
    afr            = scalar, U16,   14,    "AFR",      0.1,    0.0
    ignitionAdvance= scalar, S16,   16,    "deg",      1.0,    0.0
    pulseWidth     = scalar, U16,   18,    "ms",       0.1,    0.0

[TableEditor]
    ; 3D VE table — 8x8 grid for minimal testing.
    ; Format: tableTitle, tableName, mapName, { xBins, yBins }
    tableEditor = "VE Table 1", veTable1Tbl, veTable1Map, { rpmBins1, mapBins1 }

[Constants]
    ; Axis bins (must be defined as constants for table lookup)
    page = 1
    rpmBins1       = array, U08,   20, [8], "RPM",  100.0, 0.0
    mapBins1       = array, U08,   28, [8], "kPa",   1.0, 0.0
    veTable1Tbl    = array, U08,   36, [64], "%",    1.0, 0.0

[GaugeConfigurations]
    ; Minimal gauge configurations
    gaugeConfig = rpm,        "RPM",        0,  8000, 0,  8000, 0,  8000, 0,  0, 0
    gaugeConfig = tps,        "TPS",        0,   100, 0,   100, 0,   100, 0,  0, 0
    gaugeConfig = map,        "MAP",        0,   250, 0,   250, 0,   250, 0,  0, 0
    gaugeConfig = coolant,    "CLT",      -40,   120, 0,   120, 0,   120, 0,  0, 0
    gaugeConfig = iat,        "IAT",      -40,   120, 0,   120, 0,   120, 0,  0, 0
    gaugeConfig = afr,        "AFR",        7,    22, 0,    22, 0,    22, 0,  0, 0
    gaugeConfig = batteryVoltage, "BAT",  8,    16, 0,    16, 0,    16, 0,  0, 0

[FrontPage]
    ; Minimal frontpage gauge layout
    frontPage = 4, 2
        gauge1 = rpm
        gauge2 = tps
        gauge3 = map
        gauge4 = coolant

[Menu]
    ; Minimal menu structure
    menu = "Tuning"
        subMenu = "VE Table 1", veTable1Tbl
    menu = "Settings"
        subMenu = "Engine Constants", std_injection
