; ============================================================================
; FOME INI Definition (PLACEHOLDER)
; ============================================================================
; FOME is a rusEFI fork. Same INI structure as rusEFI.
; Replace with actual FOME INI from https://github.com/FOME-Tech/fome
; ============================================================================

[MegaTune]
    queryCommand = "Q"
    signature    = "FOME 2024"
    versionInfo  = ""
    iniSpecVersion = "3.64"

[Constants]
    endianness    = little
    nPages        = 1
    pageSize      = 1024

    page = 1

[OutputChannels]
    secl           = scalar, U08,    0,    "sec",      1.0,    0.0
    rpm            = scalar, U16,    2,    "RPM",      1.0,    0.0
    tps            = scalar, U08,    4,    "%",        1.0,    0.0
    map            = scalar, U16,    6,    "kPa",      1.0,    0.0
    coolant        = scalar, U16,    8,    "C",        1.0,   -40.0

[Menu]
    menu = "Tuning"
